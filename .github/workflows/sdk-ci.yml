name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    name: ubuntu · typecheck · build · test (+ Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wolbarg
          POSTGRES_PASSWORD: wolbarg
          POSTGRES_DB: wolbarg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolbarg -d wolbarg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:dist
      - name: Test (SQLite + live Postgres)
        env:
          WOLBARG_TEST_DATABASE_URL: postgresql://wolbarg:wolbarg@localhost:5432/wolbarg_test
        run: npm test

  sdk-windows:
    name: windows · typecheck · build · test (SQLite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:dist
      - run: npm test
