name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wolbarg
          POSTGRES_PASSWORD: wolbarg
          POSTGRES_DB: wolbarg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolbarg -d wolbarg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (SQLite + live Postgres)
        env:
          WOLBARG_TEST_DATABASE_URL: postgresql://wolbarg:wolbarg@localhost:5432/wolbarg_test
        run: npm test
